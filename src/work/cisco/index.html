<!doctype html>
<html lang="en-IE">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="author" content="Nazmul Alam" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Runs before first paint so an explicit choice is on <html> before anything
      // renders. No class means "follow the OS" — CSS handles that case, so this
      // script does nothing at all for the default.
      (function () {
        try {
          var p = localStorage.getItem('theme')
          if (p === 'light' || p === 'dark') document.documentElement.classList.add(p)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
