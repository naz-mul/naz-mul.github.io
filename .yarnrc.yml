approvedGitRepositories:
  - "**"

enableScripts: true

nodeLinker: node-modules

npmMinimalAgeGate: 0

# Released checker packages omit these transitive requirements. Keep this scoped
# to the affected releases; remove when upstream manifests declare them.
packageExtensions:
  "@astrojs/astro2tsx@0.1.3":
    dependencies:
      "@emnapi/runtime": "^1.7.1"
  "@astrojs/language-server@2.17.2":
    peerDependencies:
      typescript: "^5.0.0 || ^6.0.0"
